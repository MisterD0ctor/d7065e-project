# Generated by cmd/gendevices from deploy/devices.csv. Do not edit by hand.
# One container per device: in the simulation, the container is the device.
# Inject a fault into one device with FAULT_<ID>, e.g.
#   FAULT_CO2_0001=stuck docker compose up -d co2-0001

x-sensor: &sensor
  image: d7065e/sensor
  pull_policy: never
  restart: unless-stopped
x-actuator: &actuator
  image: d7065e/actuator
  pull_policy: never
  restart: unless-stopped
x-device-env: &device-env
  RUN_ID: ${RUN_ID:-dev}
  REGISTRY_URL: http://registry:8080
  BUILDSIM_URL: http://buildsim:9090
  PHYSICS_URL: http://physics:8080
  CLOCK_URL: http://occupancysim:8081
  MQTT_URL: tcp://mosquitto:1883

services:
  physics:
    environment:
      ROOMS: "level0/1570"

  co2-0001:  # co2 in level0/1570
    <<: *sensor
    environment:
      <<: *device-env
      DEVICE_ID: co2-0001
      DEVICE_KIND: co2
      MQTT_USER: sensor
      MQTT_PASS: sensor-pw
      FAULT: ${FAULT_CO2_0001:-}

  temp-0001:  # temp in level0/1570
    <<: *sensor
    environment:
      <<: *device-env
      DEVICE_ID: temp-0001
      DEVICE_KIND: temp
      MQTT_USER: sensor
      MQTT_PASS: sensor-pw
      FAULT: ${FAULT_TEMP_0001:-}

  occ-0001:  # occupancy in level0/1570
    <<: *sensor
    environment:
      <<: *device-env
      DEVICE_ID: occ-0001
      DEVICE_KIND: occupancy
      MQTT_USER: sensor
      MQTT_PASS: sensor-pw
      FAULT: ${FAULT_OCC_0001:-}

  damper-0001:  # damper in level0/1570
    <<: *actuator
    environment:
      <<: *device-env
      DEVICE_ID: damper-0001
      DEVICE_KIND: damper
      MQTT_USER: actuator
      MQTT_PASS: actuator-pw
      ADVERTISE_URL: http://damper-0001:8080

  heat-0001:  # heating in level0/1570
    <<: *actuator
    environment:
      <<: *device-env
      DEVICE_ID: heat-0001
      DEVICE_KIND: heating
      MQTT_USER: actuator
      MQTT_PASS: actuator-pw
      ADVERTISE_URL: http://heat-0001:8080

