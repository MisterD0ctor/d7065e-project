# Provided infrastructure only. Our own services get added here once the
# container architecture is decided (see docs/architecture-options.md).
#
#   docker compose up --build
#   BuildSim viewer:      http://127.0.0.1:9090
#   Occupancy simulator:  http://127.0.0.1:8081
services:
  buildsim:
    build:
      context: ./external/buildingsim
    command: ["start", "--host", "0.0.0.0", "--port", "9090"]
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "/buildsim", "health", "--url", "http://127.0.0.1:9090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  occupancysim:
    build:
      context: ./external/occupancysim
    environment:
      BUILDSIM_URL: http://buildsim:9090
      BUILDSIM_PUBLIC_URL: http://127.0.0.1:9090
      OCCUPANCY_FACTOR: "60"   # simulated seconds per real second
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      buildsim:
        condition: service_healthy
    restart: unless-stopped

  # ---- Ventilation Control ----
  # One Dockerfile builds every service; CMD picks the ./cmd/<name> to build.
  # The devices (one container each) are in compose.devices.yaml, which .env
  # adds through COMPOSE_FILE. RUN_ID tags every record, so set a new one per
  # experiment: RUN_ID=reactive-s1 docker compose up -d
  #
  # MQTT passwords are plain text here on purpose: this is a local lab stack.
  # The broker's ACL (deploy/mosquitto/acl) is what keeps the truth away from
  # the controller.

  mosquitto:
    image: eclipse-mosquitto:2
    entrypoint: ["/bin/sh", "/deploy/entrypoint.sh"]
    environment:
      MQTT_PASSWORDS: >-
        physics:physics-pw sensor:sensor-pw controller:controller-pw
        actuator:actuator-pw storage:storage-pw viz:viz-pw
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro,z
      - ./deploy/mosquitto/acl:/mosquitto/config/acl:ro,z
      - ./deploy/mosquitto/entrypoint.sh:/deploy/entrypoint.sh:ro,z
    ports:
      - "127.0.0.1:1883:1883"
    restart: unless-stopped

  storage:
    build: { context: ., args: { CMD: storage } }
    environment:
      RUN_ID: ${RUN_ID:-dev}
      DATA_DIR: /data
      MQTT_USER: storage
      MQTT_PASS: storage-pw
    volumes:
      - storage-data:/data
    ports:
      - "127.0.0.1:8090:8080"   # history, models, exports
    depends_on: [mosquitto]
    restart: unless-stopped

  physics:
    build: { context: ., args: { CMD: physics } }
    environment:
      ROOMS: level0/1570   # the simulated rooms; compose.devices.yaml sets them
      RUN_ID: ${RUN_ID:-dev}
      BUILDSIM_URL: http://buildsim:9090
      CLOCK_URL: http://occupancysim:8081
      MQTT_URL: tcp://mosquitto:1883
      MQTT_USER: physics
      MQTT_PASS: physics-pw
    depends_on:
      buildsim: { condition: service_healthy }
      occupancysim: { condition: service_started }
    restart: unless-stopped

  registry:
    build: { context: ., args: { CMD: registry } }
    environment:
      DB_PATH: /data/registry.db
      BUILDSIM_URL: http://buildsim:9090
      CLOCK_URL: http://occupancysim:8081
    volumes:
      - registry-data:/data
    ports:
      - "127.0.0.1:8070:8080"   # installer's form and API
    depends_on:
      buildsim: { condition: service_healthy }
    restart: unless-stopped

  # The device images. These two only build; the devices themselves are one
  # container each, generated into compose.devices.yaml by cmd/gendevices.
  sensor-image:
    build: { context: ., args: { CMD: sensor } }
    image: d7065e/sensor
    scale: 0
  actuator-image:
    build: { context: ., args: { CMD: actuator } }
    image: d7065e/actuator
    scale: 0

  controller:
    build: { context: ., args: { CMD: controller } }
    environment:
      RUN_ID: ${RUN_ID:-dev}
      POLICY: ${POLICY:-reactive}   # constant | reactive | predictive | oracle
      ORACLE_RUN: ${ORACLE_RUN:-}   # oracle only: the recorded run to replay
      STORAGE_URL: http://storage:8080
      REGISTRY_URL: http://registry:8080
      BUILDSIM_URL: http://buildsim:9090
      MQTT_URL: tcp://mosquitto:1883
      MQTT_USER: controller
      MQTT_PASS: controller-pw
    depends_on: [registry]
    restart: unless-stopped

  # Offline training (D-5): not part of `up`. Run it after recording runs:
  #   TRAIN_RUNS=train-1 docker compose run --rm train
  train:
    build: { context: ., args: { CMD: train } }
    profiles: [train]
    environment:
      STORAGE_URL: http://storage:8080
      TRAIN_RUNS: ${TRAIN_RUNS:-}
      MODEL_NAME: ${MODEL_NAME:-}
    depends_on: [storage]

volumes:
  storage-data:
  registry-data:

networks:
  default:
    # One container per device: 50 rooms × 5 devices plus the services is
    # more than a /24 holds (254 addresses). A /22 fits ~1000.
    ipam:
      config:
        - subnet: 10.90.0.0/22
